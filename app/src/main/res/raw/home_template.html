<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>主页</title>
<style>
:root{
  --sii-bg:#f6f7f9;
  --sii-fg:#1b1e23;
  --sii-sub:#6b7280;
  --sii-accent:#f97316;
  --sii-card:rgba(255,255,255,.72);
  --sii-line:rgba(127,127,127,.22);
}
html[data-night="1"]{
  --sii-bg:#121417;
  --sii-fg:#e8eaed;
  --sii-sub:#9aa0a6;
  --sii-card:rgba(30,33,38,.72);
  --sii-line:rgba(255,255,255,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--sii-bg);
  color:var(--sii-fg);
  font:14px/1.45 -apple-system,"Noto Sans SC","PingFang SC",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.page{
  min-height:100%;
  padding:64px 20px 32px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.gradient-title{
  margin:0;
  font-size:26px;
  font-weight:700;
  letter-spacing:.5px;
  background:linear-gradient(135deg,var(--sii-fg),var(--sii-accent));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.clock{text-align:center;margin-top:6px}
.clock .t{font-size:32px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;opacity:.7;margin-top:4px}
.search_bar{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  max-width:520px;
  margin-top:20px;
  padding:11px 14px;
  border-radius:999px;
  background:var(--sii-card);
  border:1px solid var(--sii-line);
}
.search_bar .icon{width:18px;height:18px;flex:none;opacity:.55}
.search_bar input{
  flex:1;
  min-width:0;
  border:0;
  outline:none;
  background:transparent;
  color:var(--sii-fg);
  font-size:15px;
  appearance:none;
  -webkit-appearance:none;
}
.search_bar input::placeholder{color:var(--sii-sub)}
.search_bar input::-webkit-search-cancel-button{display:none}
#engineName{
  flex:none;
  font-size:12px;
  color:var(--sii-sub);
  padding:2px 8px;
  border-radius:999px;
  background:rgba(127,127,127,.12);
}
#search_bar_trigger{position:absolute;inset:0;border-radius:inherit}
.opSug_wpr{
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 8px);
  display:none;
  padding:6px;
  border-radius:16px;
  background:var(--sii-card);
  border:1px solid var(--sii-line);
  box-shadow:0 10px 28px rgba(0,0,0,.16);
  z-index:6;
  overflow:hidden;
}
.opSug_wpr.on{display:block}
.opSug_item{
  display:block;
  padding:7px 10px;
  border-radius:10px;
  color:var(--sii-fg);
  font-size:13px;
  text-decoration:none;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.opSug_item:active{background:rgba(127,127,127,.16)}
.nav-grid{
  width:100%;
  max-width:520px;
  margin-top:24px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(68px,1fr));
  gap:12px;
}
.nav-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:12px 4px;
  border-radius:14px;
  background:var(--sii-card);
  border:1px solid var(--sii-line);
  color:var(--sii-fg);
  font-size:12px;
  text-decoration:none;
}
.nav-card .nav-icon{
  width:28px;
  height:28px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:600;
  color:#fff;
  background:var(--sii-accent);
}
.nav-card .nav-title{
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
#switch_window{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.32);
  z-index:9;
}
#switch_window.on{display:flex}
.switch_engine{
  width:min(78vw,320px);
  max-height:60vh;
  overflow:auto;
  padding:8px;
  border-radius:18px;
  background:var(--sii-bg);
  border:1px solid var(--sii-line);
  box-shadow:0 18px 44px rgba(0,0,0,.3);
}
.switch_engine .engine_item{
  display:block;
  width:100%;
  padding:10px 12px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:var(--sii-fg);
  font-size:14px;
  text-align:left;
}
.switch_engine .engine_item.active{color:var(--sii-accent);font-weight:600}
.switch_engine .engine_item:active{background:rgba(127,127,127,.16)}
/*__SII_CSS__*/
</style>
</head>
<body>
<main class="page">
  <h1 class="gradient-title" id="logo">Sii</h1>
  <div class="clock">
    <div class="t" id="vtime">00:00</div>
    <div class="d" id="vdate">----</div>
  </div>
  <div class="search_bar" id="searchBar">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="M20 20l-3.6-3.6"></path>
    </svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="go" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="搜索或输入网址">
    <span id="engineName"></span>
    <div id="search_bar_trigger"></div>
    <div class="opSug_wpr" id="sugList"></div>
  </div>
  <div class="nav-grid" id="navGrid"></div>
</main>
<div id="switch_window">
  <div class="switch_engine" id="engineList"></div>
</div>
<script>
(function () {
  var cfg = __SII_CONFIG__;
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).length < 2 ? '0' + n : String(n); };

  document.documentElement.setAttribute('data-night', cfg.night ? '1' : '0');

  if (cfg.title) $('logo').textContent = cfg.title;

  function tick() {
    var d = new Date();
    $('vtime').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('vdate').textContent =
      d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  tick();
  setInterval(tick, 1000);

  // 常用网站
  var grid = $('navGrid');
  cfg.sites.forEach(function (site) {
    var a = document.createElement('a');
    a.className = 'nav-card';
    a.href = site.url;
    var icon = document.createElement('span');
    icon.className = 'nav-icon';
    icon.textContent = (site.title || site.url).slice(0, 1).toUpperCase();
    var name = document.createElement('span');
    name.className = 'nav-title';
    name.textContent = site.title || site.url;
    a.appendChild(icon);
    a.appendChild(name);
    a.addEventListener('click', function (e) {
      e.preventDefault();
      window.sii.open(site.url);
    });
    grid.appendChild(a);
  });

  // 搜索引擎切换
  var engines = cfg.engines || [];
  var current = 0;
  for (var i = 0; i < engines.length; i++) {
    if (engines[i].url === cfg.searchBase) { current = i; break; }
  }
  function renderEngine() {
    $('engineName').textContent = engines[current] ? engines[current].name : '搜索';
  }
  renderEngine();

  var switchWindow = $('switch_window');
  $('engineName').addEventListener('click', function (e) {
    e.stopPropagation();
    if (!engines.length) return;
    var list = $('engineList');
    list.textContent = '';
    engines.forEach(function (engine, index) {
      var button = document.createElement('button');
      button.className = 'engine_item' + (index === current ? ' active' : '');
      button.textContent = engine.name;
      button.addEventListener('click', function () {
        current = index;
        renderEngine();
        switchWindow.classList.remove('on');
      });
      list.appendChild(button);
    });
    switchWindow.classList.add('on');
  });
  switchWindow.addEventListener('click', function (e) {
    if (e.target === switchWindow) switchWindow.classList.remove('on');
  });

  // 搜索：当前引擎与浏览器默认一致时交给浏览器（沿用其搜索设置），否则按所选引擎拼地址
  function submit(text) {
    var query = (text || '').trim();
    if (!query) return;
    var engine = engines[current];
    if (!engine || engine.url === cfg.searchBase) {
      window.sii.search(query);
      return;
    }
    var url = engine.url.indexOf('%s') >= 0
      ? engine.url.replace('%s', encodeURIComponent(query))
      : (engine.url.indexOf('{q}') >= 0
        ? engine.url.replace('{q}', encodeURIComponent(query))
        : engine.url + encodeURIComponent(query));
    window.sii.open(url);
  }

  // 建议：本地常用网站匹配（不联网）
  var suggestBox = $('sugList');
  function hideSuggest() { suggestBox.classList.remove('on'); suggestBox.textContent = ''; }
  function showSuggest(text) {
    var keyword = (text || '').trim().toLowerCase();
    if (!keyword) { hideSuggest(); return; }
    var hits = cfg.sites.filter(function (site) {
      return (site.title || '').toLowerCase().indexOf(keyword) >= 0 ||
        (site.url || '').toLowerCase().indexOf(keyword) >= 0;
    }).slice(0, 6);
    if (!hits.length) { hideSuggest(); return; }
    suggestBox.textContent = '';
    hits.forEach(function (site) {
      var item = document.createElement('a');
      item.className = 'opSug_item';
      item.href = site.url;
      item.textContent = site.title || site.url;
      item.addEventListener('click', function (e) {
        e.preventDefault();
        hideSuggest();
        window.sii.open(site.url);
      });
      suggestBox.appendChild(item);
    });
    suggestBox.classList.add('on');
  }

  var input = $('q');
  input.addEventListener('input', function () { showSuggest(input.value); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      hideSuggest();
      submit(input.value);
    }
  });
  $('search_bar_trigger').addEventListener('click', function () { input.focus(); });
  document.addEventListener('click', function (e) {
    if (!suggestBox.contains(e.target) && e.target !== input) hideSuggest();
  });
})();
</script>
</body>
</html>
