<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>主页</title>
<style>
:root{
  --sii-bg:#f6f7f9;
  --sii-fg:#1b1e23;
  --sii-sub:#6b7280;
  --sii-accent:#f97316;
  --sii-card:rgba(255,255,255,.72);
  --sii-line:rgba(127,127,127,.22);
}
html[data-night="1"]{
  --sii-bg:#121417;
  --sii-fg:#e8eaed;
  --sii-sub:#9aa0a6;
  --sii-card:rgba(30,33,38,.72);
  --sii-line:rgba(255,255,255,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--sii-bg);
  background-repeat:no-repeat;
  background-position:top center;
  background-size:100% auto;
  color:var(--sii-fg);
  font:14px/1.45 -apple-system,"Noto Sans SC","PingFang SC",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.page{
  min-height:100%;
  padding:64px 20px 32px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.gradient-title{
  margin:0;
  font-size:26px;
  font-weight:700;
  letter-spacing:.5px;
  background:linear-gradient(135deg,var(--sii-fg),var(--sii-accent));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.gradient-title .logo-img{
  width:56px;
  height:56px;
  object-fit:contain;
  -webkit-text-fill-color:initial;
}
.clock{text-align:center;margin-top:6px}
.clock .t{font-size:32px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}
.clock .sec{font-size:22px;opacity:.72;margin-left:2px}
.clock .d{font-size:12px;opacity:.7;margin-top:4px}
.search_wrap{
  position:relative;
  width:100%;
  max-width:520px;
  margin-top:20px;
  z-index:20;
}
.search_bar{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  padding:11px 14px;
  border-radius:999px;
  background:var(--sii-card);
  border:1px solid var(--sii-line);
}
.search_bar .icon{width:18px;height:18px;flex:none;opacity:.55}
.search_bar input{
  flex:1;
  min-width:0;
  border:0;
  outline:none;
  background:transparent;
  color:var(--sii-fg);
  font-size:15px;
  appearance:none;
  -webkit-appearance:none;
}
.search_bar input::placeholder{color:var(--sii-sub)}
.search_bar input::-webkit-search-cancel-button{display:none}
#engineName{
  flex:none;
  font-size:12px;
  color:var(--sii-sub);
  opacity:.6;
}
#search_bar_trigger{position:absolute;inset:0;border-radius:inherit}
.opSug_wpr{
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 8px);
  display:none;
  padding:6px;
  border-radius:16px;
  background:var(--sii-card);
  border:1px solid var(--sii-line);
  box-shadow:0 10px 28px rgba(0,0,0,.16);
  z-index:30;
  overflow:hidden;
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}
.opSug_wpr.on{display:block}
.opSug_item{
  display:block;
  padding:7px 10px;
  border-radius:10px;
  color:inherit;
  font-size:13px;
  text-decoration:none;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.opSug_item:active{background:rgba(127,127,127,.16)}
.nav-pager{
  position:relative;
  z-index:1;
  width:100%;
  max-width:520px;
  margin-top:24px;
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.nav-pager::-webkit-scrollbar{display:none}
.nav-grid{
  flex:0 0 100%;
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(68px,1fr));
  gap:12px;
  scroll-snap-align:center;
}
.sii-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.sii-dot{width:6px;height:6px;border-radius:50%;background:rgba(127,127,127,.35)}
.sii-dot.active{background:var(--sii-accent)}
.nav-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:12px 4px;
  border-radius:14px;
  background:var(--sii-card);
  border:1px solid var(--sii-line);
  color:var(--sii-fg);
  font-size:12px;
  text-decoration:none;
  -webkit-user-select:none;
  user-select:none;
}
.nav-card .nav-icon{
  width:28px;
  height:28px;
  border-radius:9px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:600;
  color:#fff;
  background:var(--sii-accent);
}
.nav-card .nav-icon img{width:100%;height:100%;object-fit:contain;background:#fff}
.nav-card .nav-title{
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav-card.dragging{
  transform:scale(1.06);
  opacity:.92;
  box-shadow:0 10px 24px rgba(0,0,0,.28);
  position:relative;
  z-index:4;
}
.opSug_sub{opacity:.6}
.sii-slot{width:100%;max-width:520px;margin-top:18px;text-align:center}
.sii-slot:empty{display:none}
#siiSlotHead{margin-top:0}
#switch_window{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.32);
  z-index:9;
}
#switch_window.on{display:flex}
.switch_engine{
  width:min(78vw,320px);
  max-height:60vh;
  overflow:auto;
  padding:8px;
  border-radius:18px;
  background:var(--sii-bg);
  border:1px solid var(--sii-line);
  box-shadow:0 18px 44px rgba(0,0,0,.3);
}
.switch_engine .engine_item{
  display:block;
  width:100%;
  padding:10px 12px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:var(--sii-fg);
  font-size:14px;
  text-align:left;
}
.switch_engine .engine_item.active{color:var(--sii-accent);font-weight:600}
.switch_engine .engine_item:active{background:rgba(127,127,127,.16)}
.switch_engine .engine_tip{
  padding:6px 12px 2px;
  font-size:11px;
  color:var(--sii-sub);
}
/*__SII_THEME__*/
/*__SII_CSS__*/
</style>
</head>
<body>
<main class="page">
  <div id="siiSlotHead" class="sii-slot"></div>
  <h1 class="gradient-title" id="logo">Sii</h1>
  <div class="clock">
    <div class="t"><span id="vtime">00:00</span><span class="sec" id="vsec">:00</span></div>
    <div class="d" id="vdate">----</div>
  </div>
  <div class="search_wrap" id="searchWrap">
    <div class="search_bar" id="searchBar">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.6-3.6"></path>
      </svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="go" autocomplete="off"
             autocapitalize="off" spellcheck="false" placeholder="搜索或输入网址">
      <span id="engineName"></span>
      <div id="search_bar_trigger"></div>
    </div>
    <div class="opSug_wpr" id="sugList"></div>
  </div>
  <div id="siiSlotTop" class="sii-slot"></div>
  <div class="nav-pager" id="navPager"></div>
  <div class="sii-dots" id="siteDots"></div>
  <div id="siiSlotBottom" class="sii-slot"></div>
</main>
<div id="switch_window">
  <div class="switch_engine" id="engineList"></div>
</div>
<script>
(function () {
  var cfg = __SII_CONFIG__;
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).length < 2 ? '0' + n : String(n); };
  var ENGINE_KEY = 'sii.engine';

  document.documentElement.setAttribute('data-night', cfg.night ? '1' : '0');

  if (cfg.logoImage) {
    var logo = $('logo');
    logo.textContent = '';
    var logoImg = document.createElement('img');
    logoImg.className = 'logo-img';
    logoImg.alt = cfg.title || 'logo';
    logoImg.src = cfg.logoImage;
    logo.appendChild(logoImg);
  } else if (cfg.title) {
    $('logo').textContent = cfg.title;
  }

  var hasBuiltinClock = true;
  function tick() {
    if (!hasBuiltinClock) return;
    var time = $('vtime');
    if (!time) { hasBuiltinClock = false; return; }
    var d = new Date();
    time.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var sec = $('vsec');
    if (sec) sec.textContent = ':' + pad(d.getSeconds());
    var date = $('vdate');
    if (date) {
      date.textContent = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
  }
  tick();
  setInterval(tick, 1000);

  // 长按（触屏）与 contextmenu（桌面）统一成一个回调
  function bindLongPress(el, action) {
    var timer = null;
    el.addEventListener('touchstart', function () {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { timer = null; action(); }, 480);
    }, { passive: true });
    el.addEventListener('touchmove', function () {
      if (timer) { clearTimeout(timer); timer = null; }
    }, { passive: true });
    el.addEventListener('touchend', function () {
      if (timer) { clearTimeout(timer); timer = null; }
    });
    el.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      action();
    });
  }

  function initialOf(site) {
    return (site.title || site.url || '?').slice(0, 1).toUpperCase();
  }

  // 网站图标：直接取站点自身 favicon（同源请求，不经第三方），失败回落首字母
  function buildIcon(site) {
    var box = document.createElement('span');
    box.className = 'nav-icon';
    var origin = '';
    try {
      var parsed = new URL(site.url);
      if (parsed.protocol === 'https:' || parsed.protocol === 'http:') {
        origin = parsed.origin;
      }
    } catch (e) { origin = ''; }
    if (!origin) {
      box.textContent = initialOf(site);
      return box;
    }
    var img = document.createElement('img');
    img.alt = '';
    var step = 0;
    img.addEventListener('error', function () {
      step++;
      if (step === 1) img.src = origin + '/apple-touch-icon.png';
      else { img.remove(); box.textContent = initialOf(site); }
    });
    img.src = origin + '/favicon.ico';
    box.appendChild(img);
    return box;
  }

  // 常用网站：每页一个 .nav-grid，横向滑动 + 页码点；长按拖动排序（页内）
  var pager = $('navPager');
  var dotBox = $('siteDots');
  var pageLists = cfg.pages || [];
  var pageCount = pageLists.length;
  var suppressClickUntil = 0;

  function buildCard(site) {
    var card = document.createElement('a');
    card.className = 'nav-card';
    card.href = site.url;
    card.setAttribute('data-url', site.url);
    var name = document.createElement('span');
    name.className = 'nav-title';
    name.textContent = site.title || site.url;
    card.appendChild(buildIcon(site));
    card.appendChild(name);
    card.addEventListener('click', function (e) {
      e.preventDefault();
      if (Date.now() < suppressClickUntil) return;
      window.sii.open(site.url);
    });
    card.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      window.sii.menuSite(site.url);
    });
    return card;
  }

  // 长按卡片：抬手未移动 = 弹菜单；拖动 = 页内排序（松手立即保存）
  function bindGridDrag(gridEl) {
    var pressTimer = null;
    var dragIndex = -1;
    var dragMoved = false;
    var dragStartY = 0;

    function endDrag() {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (dragIndex >= 0) {
        var node = gridEl.children[dragIndex];
        if (node) node.classList.remove('dragging');
      }
      dragIndex = -1;
      dragMoved = false;
      pager.style.overflowX = '';
    }

    gridEl.addEventListener('touchstart', function (e) {
      if (dragIndex >= 0) return;
      var card = e.target && e.target.closest ? e.target.closest('.nav-card') : null;
      if (!card) return;
      var startIndex = Array.prototype.indexOf.call(gridEl.children, card);
      dragStartY = e.touches[0].clientY;
      if (pressTimer) clearTimeout(pressTimer);
      pressTimer = setTimeout(function () {
        pressTimer = null;
        dragIndex = startIndex;
        dragMoved = false;
        pager.style.overflowX = 'hidden';
        var node = gridEl.children[dragIndex];
        if (node) node.classList.add('dragging');
      }, 460);
    }, { passive: true });

    gridEl.addEventListener('touchmove', function (e) {
      if (pressTimer && Math.abs(e.touches[0].clientY - dragStartY) > 8) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      if (dragIndex < 0) return;
      e.preventDefault();
      dragMoved = true;
      var y = e.touches[0].clientY;
      var nodes = Array.prototype.slice.call(gridEl.children);
      var target = nodes.length - 1;
      for (var i = 0; i < nodes.length; i++) {
        var rect = nodes[i].getBoundingClientRect();
        if (y < rect.bottom) { target = i; break; }
      }
      if (target !== dragIndex) {
        var moving = gridEl.children[dragIndex];
        var other = gridEl.children[target];
        if (moving && other && moving !== other) {
          gridEl.insertBefore(moving, target > dragIndex ? other.nextSibling : other);
          dragIndex = target;
        }
      }
    }, { passive: false });

    gridEl.addEventListener('touchend', function () {
      var node = dragIndex >= 0 ? gridEl.children[dragIndex] : null;
      var url = node ? node.getAttribute('data-url') : '';
      var moved = dragMoved;
      var wasDragging = dragIndex >= 0;
      endDrag();
      if (!wasDragging) return;
      suppressClickUntil = Date.now() + 400;
      if (!moved) {
        if (url) window.sii.menuSite(url);
        return;
      }
      var urls = Array.prototype.map.call(gridEl.children, function (child) {
        return child.getAttribute('data-url');
      });
      window.sii.reorderSites(JSON.stringify(urls));
    });

    gridEl.addEventListener('touchcancel', endDrag);
  }

  pageLists.forEach(function (list) {
    var gridEl = document.createElement('div');
    gridEl.className = 'nav-grid';
    list.forEach(function (site) { gridEl.appendChild(buildCard(site)); });
    pager.appendChild(gridEl);
    bindGridDrag(gridEl);
  });

  if (!cfg.showSites || pageCount === 0) {
    pager.style.display = 'none';
    dotBox.style.display = 'none';
  } else if (pageCount === 1) {
    dotBox.style.display = 'none';
  } else {
    for (var d = 0; d < pageCount; d++) {
      (function (index) {
        var dot = document.createElement('span');
        dot.className = 'sii-dot' + (index === 0 ? ' active' : '');
        dot.addEventListener('click', function () {
          pager.scrollTo({ left: index * pager.clientWidth, behavior: 'smooth' });
        });
        dotBox.appendChild(dot);
      })(d);
    }
    pager.addEventListener('scroll', function () {
      var index = Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth));
      var children = dotBox.children;
      for (var i = 0; i < children.length; i++) {
        children[i].className = 'sii-dot' + (i === index ? ' active' : '');
      }
    }, { passive: true });
  }

  // 搜索引擎切换（记住上次选择；长按设为浏览器默认引擎）
  var engines = cfg.engines || [];
  var current = 0;
  for (var i = 0; i < engines.length; i++) {
    if (engines[i].url === cfg.searchBase) { current = i; break; }
  }
  try {
    var saved = localStorage.getItem(ENGINE_KEY);
    if (saved) {
      for (var j = 0; j < engines.length; j++) {
        if (engines[j].url === saved) { current = j; break; }
      }
    }
  } catch (e) { }

  function renderEngine() {
    $('engineName').textContent = engines[current] ? engines[current].name : '搜索';
  }
  renderEngine();

  var switchWindow = $('switch_window');
  $('engineName').addEventListener('click', function (e) {
    e.stopPropagation();
    if (!engines.length) return;
    var list = $('engineList');
    list.textContent = '';
    engines.forEach(function (engine, index) {
      var button = document.createElement('button');
      button.className = 'engine_item' + (index === current ? ' active' : '');
      button.textContent = engine.name;
      button.addEventListener('click', function () {
        current = index;
        try { localStorage.setItem(ENGINE_KEY, engine.url); } catch (e) { }
        renderEngine();
        switchWindow.classList.remove('on');
      });
      bindLongPress(button, function () { window.sii.setDefaultEngine(engine.url); });
      list.appendChild(button);
    });
    var tip = document.createElement('div');
    tip.className = 'engine_tip';
    tip.textContent = '长按可设为默认搜索引擎';
    list.appendChild(tip);
    switchWindow.classList.add('on');
  });
  switchWindow.addEventListener('click', function (e) {
    if (e.target === switchWindow) switchWindow.classList.remove('on');
  });

  function buildEngineUrl(engine, query) {
    if (engine.url.indexOf('%s') >= 0) {
      return engine.url.replace('%s', encodeURIComponent(query));
    }
    if (engine.url.indexOf('{q}') >= 0) {
      return engine.url.replace('{q}', encodeURIComponent(query));
    }
    return engine.url + encodeURIComponent(query);
  }

  // 当前引擎与浏览器默认一致时交给浏览器（沿用其搜索设置与联想），否则按所选引擎拼地址
  function submit(text) {
    var query = (text || '').trim();
    if (!query) return;
    var engine = engines[current];
    if (!engine || engine.url === cfg.searchBase) {
      window.sii.search(query);
      return;
    }
    window.sii.open(buildEngineUrl(engine, query));
  }

  // 自定义 HTML 片段：可插到顶部 / 搜索框下方 / 页面底部；<script> 重建后才会执行
  function injectCustomHtml() {
    if (!cfg.customHtml) return;
    var html = cfg.customHtml;
    var hasClock = /id\s*=\s*["']?vtime|id\s*=\s*["']?vdate|class\s*=\s*["'][^"']*\bclock\b/.test(html);
    var pos = cfg.customHtmlPos || 0;
    // 片段自带时钟 = 它本来就是标题/时钟层，固定放顶部，不跟着旧的位置设置跑到下面
    if (hasClock) pos = 2;
    var slot = pos === 1 ? $('siiSlotBottom') : (pos === 2 ? $('siiSlotHead') : $('siiSlotTop'));
    if (!slot) return;
    slot.innerHTML = html;
    // 片段自带标题/时钟时移除模板内置的那份，否则会出现两份、且脚本取错元素
    if (hasClock) {
      var builtinClock = document.querySelector('.page > .clock');
      if (builtinClock) builtinClock.remove();
      hasBuiltinClock = false;
    }
    if (/gradient-title/.test(html)) {
      var builtinLogo = document.querySelector('.page > #logo');
      if (builtinLogo) builtinLogo.remove();
    }
    var scripts = slot.querySelectorAll('script');
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i];
      var fresh = document.createElement('script');
      if (old.textContent) fresh.textContent = old.textContent;
      if (old.src) fresh.src = old.src;
      old.parentNode.replaceChild(fresh, old);
    }
  }
  injectCustomHtml();

  // 建议：交给浏览器（历史/书签/联网，受设置控制），这里只负责渲染
  var suggestBox = $('sugList');
  var suggestTimer = null;
  function hideSuggest() { suggestBox.classList.remove('on'); suggestBox.textContent = ''; }

  function renderSuggest(items) {
    if (!items || !items.length) { hideSuggest(); return; }
    suggestBox.textContent = '';
    var seen = {};
    items.slice(0, 8).forEach(function (item) {
      var raw = item.value || '';
      var title = item.title || raw;
      if (!title || seen[title]) return;
      seen[title] = 1;
      // 原生建议里可能有带 %s 的搜索模板地址，不能当链接用，统一按关键词提交
      var isTemplate = raw.indexOf('%s') >= 0 || raw.indexOf('{q}') >= 0;
      var value = isTemplate ? title : (raw || title);
      var isUrl = !isTemplate && /^(https?:|file:|www\.)/i.test(value);
      var entry = document.createElement('a');
      entry.className = 'opSug_item';
      entry.textContent = title;
      var sub = item.subtitle || '';
      if (sub && sub.indexOf('http') < 0 && sub.indexOf('%s') < 0) {
        var subEl = document.createElement('span');
        subEl.className = 'opSug_sub';
        subEl.textContent = ' · ' + sub;
        entry.appendChild(subEl);
      }
      entry.href = isUrl ? value : '#';
      entry.addEventListener('click', function (e) {
        e.preventDefault();
        hideSuggest();
        if (isUrl) {
          window.sii.open(value);
        } else {
          input.value = title;
          submit(title);
        }
      });
      suggestBox.appendChild(entry);
    });
    if (!suggestBox.childNodes.length) { hideSuggest(); return; }
    suggestBox.classList.add('on');
  }

  window.siiOnSuggest = function (query, payload) {
    if ((input.value || '').trim() !== (query || '').trim()) return;
    var items = [];
    try { items = JSON.parse(payload); } catch (e) { return; }
    renderSuggest(items);
  };

  var input = $('q');
  input.addEventListener('input', function () {
    var value = input.value || '';
    if (!value.trim()) { hideSuggest(); return; }
    if (suggestTimer) clearTimeout(suggestTimer);
    suggestTimer = setTimeout(function () {
      try { window.sii.suggest(value); } catch (e) { }
    }, 120);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      hideSuggest();
      submit(input.value);
    }
  });
  $('search_bar_trigger').addEventListener('click', function () { input.focus(); });
  document.addEventListener('click', function (e) {
    if (!suggestBox.contains(e.target) && e.target !== input) hideSuggest();
  });
})();
</script>
</body>
</html>
